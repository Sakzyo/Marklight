<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="referrer" content="no-referrer">
<meta name="color-scheme" content="light dark">
<style>
:root {
  color-scheme: light dark;
  --text: #1f2328;
  --muted: #59636e;
  --background: #ffffff;
  --subtle: #f6f8fa;
  --border: #d1d9e0;
  --link: #0969da;
  --mark: rgba(129, 139, 152, 0.14);
}
@media (prefers-color-scheme: dark) {
  :root {
    --text: #e6edf3;
    --muted: #9198a1;
    --background: #1e1f22;
    --subtle: #2a2c30;
    --border: #3d444d;
    --link: #4493f8;
    --mark: rgba(101, 108, 118, 0.25);
  }
}
html { background: var(--background); }
body {
  margin: 0;
  color: var(--text);
  background: var(--background);
  font: 15px/1.6 -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
  overflow-wrap: break-word;
}
#doc { max-width: 46rem; margin: 0 auto; padding: 24px 28px 48px; }
/* A ring around a whole document isn't useful, and WebKit walks every box in the
   editing host to find its edges, on every paint. */
#doc:focus { outline: none; }
#doc > div > div > :first-child { margin-top: 0; }
p, ul, ol, blockquote, pre, table, hr { margin: 0 0 1em; }
h1, h2, h3, h4, h5, h6 { margin: 1.5em 0 0.6em; font-weight: 600; line-height: 1.25; }
h1 { font-size: 1.9em; padding-bottom: 0.25em; border-bottom: 1px solid var(--border); }
h2 { font-size: 1.45em; padding-bottom: 0.25em; border-bottom: 1px solid var(--border); }
h3 { font-size: 1.2em; }
h4 { font-size: 1em; }
h5 { font-size: 0.9em; }
h6 { font-size: 0.85em; color: var(--muted); }
a { color: var(--link); text-decoration: none; }
a:hover { text-decoration: underline; }
ul, ol { padding-left: 2em; }
li > p { margin: 0.2em 0; }
li > ul, li > ol { margin-bottom: 0; }
li:has(> input[type=checkbox]) { list-style: none; }
li > input[type=checkbox] { margin: 0 0.4em 0 -1.4em; vertical-align: middle; }
li > input[type=checkbox] + p { display: inline; }
blockquote { padding: 0 1em; color: var(--muted); border-left: 0.25em solid var(--border); }
hr { height: 2px; border: 0; background: var(--border); margin: 1.5em 0; }
code, pre, .inline-html { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 0.875em; }
code, .inline-html { padding: 0.15em 0.35em; border-radius: 5px; background: var(--mark); }
pre { padding: 12px 16px; overflow-x: auto; border-radius: 7px; background: var(--subtle); line-height: 1.45; }
pre code { padding: 0; font-size: 1em; background: none; border-radius: 0; }
pre.front-matter { color: var(--muted); border: 1px solid var(--border); background: none; }
.opaque { white-space: pre-wrap; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 0.875em; }
table { display: block; width: max-content; max-width: 100%; overflow-x: auto; border-collapse: collapse; }
th, td { padding: 5px 12px; border: 1px solid var(--border); }
th { font-weight: 600; }
tbody tr:nth-child(even) { background: var(--subtle); }
img { max-width: 100%; }
::selection { background: rgba(9, 105, 218, 0.25); }
</style>
</head>
<body><main id="doc" contenteditable="true" spellcheck="false" autocorrect="off" autocapitalize="off" writingsuggestions="false"></main></body>
</html>
